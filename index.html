button{font:inherit;color:inherit;cursor:pointer}

nav{display:flex;gap:8px;margin-bottom:14px}

.node.bad{border-color:var(--bad)}.node.good{border-color:var(--good)}
.arrow{align-self:center;font-size:1.6rem;color:var(--a);font-weight:900}

.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:104px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}

.card .ko{font-weight:700;color:var(--ink);font-size:1rem}

details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}

mark{background:color-mix(in srgb,var(--a) 28%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q p{margin:0 0 8px;font-family:"Noto Serif KR",serif;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.opts button:hover{border-color:var(--a)}
.opts button.ok{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.opts button.no{background:var(--bad);border-color:var(--bad);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips span{background:color-mix(in srgb,var(--a) 16%,var(--card));border-radius:999px;padding:2px 10px;font-size:.8rem}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.model{margin-top:8px;font-family:"Noto Serif KR",serif;background:color-mix(in srgb,var(--good) 14%,var(--card));border-left:5px solid var(--good);border-radius:8px;padding:8px 12px;display:none}

.btn{margin-top:8px;background:var(--a);color:#fff;border:0;border-radius:10px;padding:7px 14px;font-weight:700}

.t h1{font-family:"Noto Serif KR",serif;margin:0 0 4px}

.stat b{display:block;font-size:1.6rem}

.tc input{font:inherit;width:230px;max-width:100%;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.qk{font:inherit;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.sid input#nm{width:110px;letter-spacing:0}.sid input#cc,.sid input#tcc{width:84px;letter-spacing:0}

  if(e.target.id==='mk'){const t=makeText(),o=$('#out');o.value=t;o.select();
    const done=ok=>{$('#cp').textContent=ok?'✅ 복사됐어요! 붙여 넣기 하세요.':'위 글을 직접 선택해서 복사해 주세요.'};
    try{navigator.clipboard.writeText(t).then(()=>done(true),()=>{try{done(document.execCommand('copy'))}catch(x){done(false)}})}catch(x){try{done(document.execCommand('copy'))}catch(y){done(false)}}return}
  if(e.target.id==='grd'){const pi=cur(),p=D[pi];let un=0;p.qs.forEach((s,si)=>s.i.forEach((it,k)=>{if(st['a'+pi+si+k]===undefined)un++}));
    if(un>0&&!gArm){gArm=true;$('#gmsg').textContent='아직 안 푼 문제가 '+un+'개 있어요. 그래도 채점하려면 한 번 더 누르세요.';return}
    gArm=false;GR[pi]=true;render();const g=$('#gsec');if(g)g.scrollIntoView({block:'center'});return}
  if(e.target.id==='gre'){const pi=cur();for(const k of Object.keys(st))if(k.startsWith('a'+pi))delete st[k];GR[pi]=false;gArm=false;save();render();if(typeof push==='function')push();return}
  if(e.target.id==='rs'){if(!window._rsA){window._rsA=1;e.target.textContent='정말 지워요? 한 번 더';setTimeout(()=>{window._rsA=0;const b=$('#rs');if(b)b.textContent='🔄 다시 풀기'},4000);return}window._rsA=0;const pi=cur();for(const k of Object.keys(st))if(k.startsWith('a'+pi)||k.startsWith('w'+pi))delete st[k];GR[pi]=false;save();render();if(typeof push==='function')push();return}
  const m=e.target.closest('[data-m]');
  if(m){$('#m'+m.dataset.m).classList.toggle('on')}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.w){st[e.target.dataset.w]=e.target.value;save()}
  if(e.target.id==='sid'){st.sid=e.target.value.replace(/\D/g,'').slice(0,5);e.target.value=st.sid;save()}
  if(e.target.id==='nm'){st.nm=e.target.value.slice(0,10);save()}
});
$('#reset').onclick=()=>{st={};save();render()};
addEventListener('hashchange',render);
render();
</script>
</body>
</html>
